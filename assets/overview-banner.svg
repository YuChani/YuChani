<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">김유찬 — 로봇 자율주행, SLAM, 다중센서 통합</title>
  <desc id="desc">짙은 남색 바탕에 이름과 연구 분야, 오른쪽에 점군과 로봇 경로를 표현한 추상 그래픽.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#213449" stroke-width="1"/>
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="300" fill="#101d2b"/>
    <rect x="770" width="430" height="300" fill="url(#grid)"/>
    <rect x="40" y="46" width="36" height="4" rx="2" fill="#50dbc6"/>
    <g font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
