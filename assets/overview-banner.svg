      <text x="204" y="114" fill="#8fa5bc" font-size="23" letter-spacing="2">YUCHAN KIM</text>
      <text x="40" y="168" fill="#d6e2ef" font-size="25" font-weight="500">로봇 자율주행 · SLAM · 다중센서 통합</text>
      <text x="40" y="216" fill="#9fb4c9" font-size="19">센서의 시간과 좌표를 맞추고, 지도와 주행으로 연결합니다.</text>
      <text x="40" y="264" fill="#50dbc6" font-size="13" letter-spacing="1.8">C++ / PYTHON / ROS 2</text>
    </g>
    <g fill="none" stroke="#52758f" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round" opacity=".8">
      <path d="M802 74H902V126H1006V54H1144V174H1090V248H930V210H802Z"/>
      <path d="M818 90H886V142H1022V70H1128V158H1074V232H946V194H818Z"/>
